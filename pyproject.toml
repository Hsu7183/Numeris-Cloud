[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numeris"
version = "1.2.0"
description = "Numeris 彩球分析與選號系統"
readme = "README_繁體中文.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "jinja2>=3.1,<4",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "tenacity>=9,<10",
  "truststore>=0.10,<1",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.3,<7",
  "pandas>=2.2,<3",
  "numpy>=2.1,<3",
  "openpyxl>=3.1,<4",
  "pyarrow>=18,<24",
  "playwright>=1.49,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "mypy==1.15.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
timid = true
omit = ["*/__init__.py", "app/services/data_sources/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app/services/analytics/core.py", "app/services/generation/generators.py"]
ignore_missing_imports = true
follow_imports = "normal"
incremental = false
cache_dir = "NUL"
