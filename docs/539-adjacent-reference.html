<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今彩539｜相鄰次數39格</title>
<style>
:root{font-family:"Microsoft JhengHei",Arial,sans-serif;color:#193e30;background:#eef2ea}
*{box-sizing:border-box}body{margin:0}main{padding:32px 20px}header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:30px}h1{font-size:24px;margin:0}a{color:#076b50;font-size:14px}p{color:#61776a;font-size:14px;margin:12px 0 24px}
.sheet{background:#fffefa;border:1px solid #bcccbc;padding:22px 12px 26px;box-shadow:0 8px 28px #193e3010}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.heading strong{font-size:18px}.heading span{font-size:12px;color:#61776a}.row{display:grid;grid-template-columns:repeat(39,minmax(0,1fr));border-top:1px solid #bcccbc;border-left:1px solid #bcccbc}.cell{min-width:0;text-align:center;padding:14px 0;border-right:1px solid #bcccbc;border-bottom:1px solid #bcccbc}.count{display:block;color:#193e3040;font-size:clamp(10px,.9vw,14px);white-space:nowrap}.ball{display:block;font-size:clamp(12px,1.7vw,28px);font-weight:600;margin-top:12px;white-space:nowrap}.cell[data-count="4"]{background:#e4efdf}.cell[data-count="3"]{background:#f0f5e8}.cell[data-count="0"] .ball{color:#78887d}.note{font-size:12px;color:#61776a;margin-top:18px}
</style>
<style>
.sheet{min-width:0}.row{min-width:0;grid-template-columns:repeat(39,minmax(0,1fr));container-type:inline-size}.cell{padding:10px 0}.ball{font-size:clamp(1px,1.45cqw,20px);margin-top:8px}.count{font-size:clamp(1px,.8cqw,11px)}
.row .cell:nth-child(5n):not(:last-child){border-right:2px solid #52755e}
.row .cell:nth-child(-n+5){background:#e4efdf}
.row .cell:nth-child(n+6):nth-child(-n+10){background:#e1edf8}
.row .cell:nth-child(n+11):nth-child(-n+15){background:#fff0d7}
.row .cell:nth-child(n+16):nth-child(-n+20){background:#eee4f5}
.row .cell:nth-child(n+21):nth-child(-n+25){background:#f9e3e7}
.row .cell:nth-child(n+26):nth-child(-n+30){background:#dff1ed}
.row .cell:nth-child(n+31):nth-child(-n+35){background:#f4efce}
.row .cell:nth-child(n+36){background:#e8e8f3}
.row .count{color:rgba(25,62,48,.5)}
.heading{flex-wrap:wrap}
@media(max-width:600px){main{padding:20px 8px}.sheet{padding:18px 6px}.row .cell:nth-child(5n):not(:last-child){border-right-width:1px}}
</style>
</head>
<body><main>
<header><h1>今彩539 · 相鄰次數</h1><a href="output.html">返回相鄰分數排名</a><a href="539-adjacent-counts-backtest.html">相鄰次數歷史試算</a></header>
<p id="status" role="status" aria-live="polite">正在載入最新539資料…</p>
<section class="sheet" aria-label="相鄰次數，一列39個號碼">
<div class="heading"><strong>39個號碼 · 同一行顯示</strong><span>排名由左至右 · 每5格一組 · 次數在上，球號在下</span></div>
<div class="row" id="numbers"></div>
<div class="note">近20／50／100／200期各計一次相鄰，跨範圍累計0～4次；同次數依球號由小到大。每天22:00更新資料。</div>
</section>
</main>
<script>
async function update() {
  try {
    const response = await fetch('data/daily539.json', {cache:'no-store'});
    if (!response.ok) throw new Error('資料讀取失敗');
    const payload = await response.json();
    if (!Array.isArray(payload.draws) || payload.draws.length < 200) throw new Error('需要完整近200期資料');
    for (const d of payload.draws) {
      if (!Array.isArray(d.numbers) || d.numbers.length !== 5 || new Set(d.numbers).size !== 5 || d.numbers.some(n => !Number.isInteger(n) || n < 1 || n > 39)) throw new Error('球號資料不完整');
    }
    const totals = Array(40).fill(0);
    for (const limit of [20,50,100,200]) {
      const frequency = Array(40).fill(0);
      payload.draws.slice(0,limit).forEach(d => d.numbers.forEach(n => frequency[n]++));
      const counts = [...new Set(frequency.slice(1))].filter(Boolean).sort((a,b) => b-a);
      const rows = counts.map(c => Array.from({length:39},(_,i) => i+1).filter(n => frequency[n] === c));
      const adjacent = new Set();
      for (const target of payload.draws[0].numbers) {
        const ri = rows.findIndex(row => row.includes(target));
        const ci = rows[ri].indexOf(target);
        for (const [r,c] of [[ri,ci-1],[ri,ci+1],[ri-1,ci],[ri+1,ci]]) {
          if (r >= 0 && c >= 0 && rows[r]?.[c] !== undefined) adjacent.add(rows[r][c]);
        }
      }
      adjacent.forEach(n => totals[n]++);
    }
    const ordered = Array.from({length:39},(_,i) => i+1).sort((a,b) => totals[b]-totals[a] || a-b);
    document.getElementById('numbers').innerHTML = ordered.map(n => `<div class="cell" data-count="${totals[n]}" aria-label="${n}號，${totals[n]}次"><span class="count">${totals[n]}次</span><span class="ball">${String(n).padStart(2,'0')}</span></div>`).join('');
    document.getElementById('status').textContent = `最新 ${payload.latest_draw_no}期 · ${payload.latest_draw_date} · 依相鄰次數由高到低排列`;
  } catch (error) {
    document.getElementById('status').textContent = `${error.message}；已顯示的有效結果會保留，請重新整理再試。`;
  }
}
update();
</script>
</body></html>
