<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今彩539｜手寫格表</title>
  <link rel="stylesheet" href="handwritten-539-grid.css?v=2">
</head>
<body>
  <main class="sheet-page">
    <header class="sheet-header">
      <a href="./">← 返回統計</a>
      <div><strong>今彩 539 手寫格表</strong><span>依照片的 1–20 號大格與右側 539 號碼欄製作</span></div>
    </header>
    <p id="sheet-status">正在讀取資料…</p>
    <section class="sheet-layout" aria-live="polite">
      <section class="number-sheet">
        <header><strong>539</strong><span>01–20 號位置表</span></header>
        <table id="number-grid"></table>
        <p>紅圈表示最新一期開出號碼。</p>
      </section>
      <section class="draw-sheet adjacent-sheet">
        <header><strong>相鄰</strong><span>20／50／100／200 統計</span></header>
        <div id="adjacent-grid"></div>
        <p>依四種期數顯示各號碼的相鄰出現次數。</p>
      </section>
    </section>
  </main>
  <script src="handwritten-539-grid.js?v=2"></script>
</body>
</html>
