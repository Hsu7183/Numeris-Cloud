<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今彩539｜手寫格表</title>
  <link rel="stylesheet" href="handwritten-539-grid.css?v=1">
</head>
<body>
  <main class="sheet-page">
    <header class="sheet-header">
      <a href="./">← 返回統計</a>
      <div><strong>今彩 539 手寫格表</strong><span>依照片的 1–20 號大格與右側 539 號碼欄製作</span></div>
    </header>
    <p id="sheet-status">正在讀取資料…</p>
    <section class="sheet-layout" aria-live="polite">
      <section class="number-sheet">
        <header><strong>539</strong><span>01–20 號位置表</span></header>
        <table id="number-grid"></table>
        <p>紅圈表示最新一期開出號碼。</p>
      </section>
      <section class="draw-sheet">
        <header><strong>539</strong><span>本期開獎號碼</span></header>
        <table id="draw-grid"></table>
        <p>依開獎順序列出五個號碼。</p>
      </section>
    </section>
  </main>
  <script src="handwritten-539-grid.js?v=1"></script>
</body>
</html>
