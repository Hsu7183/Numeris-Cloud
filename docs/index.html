<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="今彩539近20、50、100、200期獎號統計。">
  <title>Numeris Cloud｜今彩539期數統計</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <p class="brand">NUMERIS <span>台灣彩券 · DAILY 539</span></p>
      <h1>今彩539 <em>期數統計比較</em></h1>
      <p class="lead">比較 1–39 號在近 20、50、100、200 期的出現次數。</p>
      <p id="status" class="status" role="status">載入資料中…</p>
    </header>
    <section id="results" class="results hidden" aria-live="polite">
      <div class="result-header">
        <div><p class="eyebrow">資料範圍</p><h2>1–39 號 · 20 / 50 / 100 / 200 期比較</h2></div>
        <div class="latest"><span>最新一期</span><strong id="latest-draw">—</strong></div>
      </div>
      <div id="comparison-list" class="comparison-list"></div>
      <p class="notice">資料由 GitHub Actions 手動更新；統計僅呈現歷史資料，不代表未來開獎機率。</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
