<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大樂透｜手寫格表</title>
  <link rel="stylesheet" href="handwritten-649-grid.css?v=2">
</head>
<body>
  <main class="sheet-page">
    <header class="sheet-header">
      <a href="index.html">← 返回統計</a>
      <div><strong>大樂透 手寫格表</strong><span>依照片的 1–49 號大格與右側 649 號碼欄製作</span></div>
    </header>
    <p id="sheet-status">正在讀取資料…</p>
    <nav id="draw-date-nav" aria-label="期別日期" style="display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px">
      <a href="handwritten-649-overlay.html" style="font-weight:900">6／12／18天疊加</a>
    </nav>
    <section class="sheet-layout" aria-live="polite">
      <section class="number-sheet">
        <header><strong>649</strong><span>01–49 號位置表　<span id="winning-numbers"></span></span></header>
        <table id="number-grid"></table>
        <p>紅圈表示最新一期開出號碼。</p>
      </section>
      <section class="draw-sheet" style="overflow-x:auto">
        <header><strong>相鄰</strong><span>相鄰統計號碼</span></header>
        <table id="draw-grid" style="min-width:850px"></table>
        <p>依相鄰統計次數分組顯示號碼。</p>
      </section>
    </section>
  </main>
  <script src="handwritten-649-grid.js?v=3"></script>
