<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="大樂透近20、50、100、200期獎號統計。">
  <title>Numeris Cloud｜大樂透期數統計</title>
  <link rel="stylesheet" href="styles.css?v=home-original-v1">
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <a class="brand" href="../index.html" style="margin-right:12px">← 彩種首頁</a><p class="brand">NUMERIS</p><p class="eyebrow">台灣彩券 · LOTTO 6/49</p>
      <h1>大樂透 <em>期數統計比較</em></h1>
      <p class="lead">同時比較 1–49 號在近 20、50、100、200 期的出現次數與期次順序（僅計 6 個主號，特別號另列）。</p>
      <button id="fetch-draws" class="fetch-button" type="button"><span aria-hidden="true">↓</span> 重新載入統計</button>
      <p id="status" class="status" role="status" aria-live="polite">正在載入已更新資料</p>
    </header>
    <section id="results" class="results hidden" aria-live="polite">
      <div class="result-header">
        <div><p class="eyebrow">資料範圍</p><h2 id="range-title">四種期數統計比較</h2></div>
        <div class="output-actions"><a class="xlsx-output-link" href="output.html">開啟 XLSX 表格</a><a class="xlsx-output-link" href="period-grid.html">開啟期數格表</a><a class="xlsx-output-link" href="pattern-grid.html?v=header-text-v1">開啟 Excel 組合表</a><a class="xlsx-output-link" href="pattern-template.html?v=header-text-v1">開啟 Excel 空白範本表</a><a class="xlsx-output-link" href="excel-649-grid.html?v=3">開啟 Excel 649 格表</a><a class="xlsx-output-link" href="handwritten-649-grid.html?v=1">開啟手寫 649 格表</a><div class="latest"><span>最新一期</span><strong id="latest-draw">—</strong></div></div>
      </div>
      <p id="highlight-legend" class="highlight-legend hidden"></p>
      <div id="comparison-list" class="comparison-list"></div>
    </section>
  </main>
  <footer>資料由 GitHub Actions 手動更新；統計僅呈現歷史資料，不代表未來開獎機率。</footer>
  <script src="app.js?v=home-original-v1"></script>
</body>
</html>
