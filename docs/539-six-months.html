<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今彩539｜6個月開獎號碼表</title><link rel="stylesheet" href="daily539-report.css?v=2"></head>
<body><main class="report-page"><a href="index.html">← 返回首頁</a><h1>今彩539｜6個月開獎號碼表</h1><p>單張A4直式；只列開獎日，日期與星期分格，月份在每月第一筆標示。最後接續20期的日期、星期及空白獎號。</p><section class="report-card"><p id="sheet-status" aria-live="polite">正在讀取最新表格…</p><div class="report-actions"><a id="sheet-pdf" class="report-download" href="reports/539-6-months/latest.pdf" download>下載6個月版 A4 PDF</a><a id="sheet-open" href="reports/539-6-months/latest.pdf" target="_blank" rel="noopener">開啟 PDF ↗</a></div><a id="sheet-preview" href="reports/539-6-months/latest.pdf" target="_blank" rel="noopener"><img id="sheet-image" src="reports/539-6-months/latest.png" alt="6個月開獎號碼表，最後20期獎號留白" style="display:block;width:100%;height:auto"></a></section><footer>每天隨官方資料更新；台灣時間22:00更新、23:00補同步，排程實際完成時間依GitHub Actions而定。列印選「實際大小／100%」。</footer></main><script>
async function refreshSheet(){try{const response=await fetch('reports/539-6-months/latest.json',{cache:'no-store'});if(!response.ok)throw Error('unavailable');const data=await response.json();const version=encodeURIComponent(data.cutoff+'-'+data.draw_count);document.getElementById('sheet-status').textContent=`資料期間：${data.start_date}～${data.cutoff}｜已開獎${data.draw_count}期｜接續20期空白獎號`;for(const id of ['sheet-pdf','sheet-open','sheet-preview'])document.getElementById(id).href='reports/539-6-months/latest.pdf?v='+version;document.getElementById('sheet-image').src='reports/539-6-months/latest.png?v='+version;}catch(error){document.getElementById('sheet-status').textContent='最新日期暫時無法讀取，請核對表格上方的資料截止日。';}}
refreshSheet();setInterval(refreshSheet,300000);window.addEventListener('focus',refreshSheet);
</script></body></html>
