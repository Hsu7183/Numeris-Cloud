name: 換日更新539每日A4總表

on:
  workflow_dispatch:
  schedule:
    # 台灣時間每天00:10換日；開獎後由既有22:00/23:00資料流程重建。
    - cron: "10 16 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_539_daily_report.py"
      - "scripts/calculate_539_daily_report.cjs"
      - "scripts/daily539_report_data.py"
      - "scripts/daily539_blank_report.py"
      - "scripts/daily-report-requirements.txt"
      - ".github/workflows/update-539-daily-report.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安裝報表字型與套件
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-wqy-zenhei
          pip install -r scripts/daily-report-requirements.txt
          python -m playwright install --with-deps chromium
      - name: 產生每日單頁A4 PDF與預覽
        run: python -m scripts.build_539_daily_report
      - name: 儲存報表
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reports/daily539
          if ! git diff --cached --quiet; then
            git commit -m "chore(report): refresh daily 539 A4 report"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Wait for Pages artifact metadata
        run: sleep 30
      - uses: actions/deploy-pages@v5
