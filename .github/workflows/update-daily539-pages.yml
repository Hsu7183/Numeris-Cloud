name: 更新今彩539 GitHub Pages 資料

on:
  workflow_dispatch:
  # 今彩539週一至週六約 20:35 開獎；22:00（台灣時間）後更新。
  schedule:
    - cron: "0 14 * * 1-6"
  push:
    paths:
      - "docs/data/.gitkeep"
      - "scripts/export_daily539_static.py"
      - ".github/workflows/update-daily539-pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-daily539-pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝 Numeris
        run: pip install .
      - name: 抓取官方資料並產生靜態統計
        run: python -m scripts.export_daily539_static
      - name: 更新相鄰分數與次數歷史試算
        run: |
          python -m scripts.backtest_539_adjacent
          python -m scripts.backtest_539_adjacent_counts
          node scripts/verify_539_adjacent.cjs
          node scripts/verify_539_adjacent_counts.cjs
      - name: 儲存更新後的資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/daily539.json
          git add docs/539-adjacent-backtest.html docs/539-adjacent-backtest.json
          git add docs/539-adjacent-counts-backtest.html docs/539-adjacent-counts-backtest.json
          git add reports/539-adjacent-source.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): update Daily 539 statistics"
          git push
      - name: 發布更新後的看板
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
