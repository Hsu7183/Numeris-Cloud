name: 更新今彩539與大樂透 GitHub Pages 資料

on:
  workflow_dispatch:
  # 每天台灣時間22:00更新兩種彩券，23:00補同步；包含加開日。
  schedule:
    - cron: "0 14,15 * * *"
  push:
    paths:
      - "docs/data/.gitkeep"
      - "scripts/export_daily539_static.py"
      - ".github/workflows/update-daily539-pages.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝 Numeris
        run: pip install .
      - name: 抓取官方資料並產生靜態統計
        run: |
          python -m scripts.export_daily539_static
          python -m scripts.export_lotto649_static
      - name: 更新今彩539AI快報（失敗時保留有效資料）
        continue-on-error: true
        run: python -m scripts.update_539_aibrief_web
      - name: 更新大樂透AI快報（失敗時保留有效資料）
        continue-on-error: true
        run: python -m scripts.update_lotto649_aibrief
      - name: 產生大樂透所有模式
        run: python -m scripts.build_lotto649_pages
      - name: 更新相鄰分數與次數歷史試算
        run: |
          python -m scripts.backtest_539_adjacent
          python -m scripts.backtest_539_adjacent_counts
          node scripts/verify_539_adjacent.cjs
          node scripts/verify_539_adjacent_counts.cjs
      - name: 重建同截止日的539合併排名（含最久未開因素）
        run: |
          python - <<'PY'
          import json
          from scripts.build_539_combined import ROOT, main
          data = json.loads((ROOT / 'docs/data/daily539.json').read_text(encoding='utf-8'))
          brief = json.loads((ROOT / 'docs/data/539-pilio-reference.json').read_text(encoding='utf-8'))
          if data['latest_draw_date'] == brief['source_date']:
              main()
          else:
              print('快報與開獎截止日不同，保留已標示截止日的合併排名。')
          PY
      - name: 儲存更新後的資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/daily539.json docs/data/539-aibrief.json docs/data/539-aibrief-status.json
          git add docs/data/539-combined.json docs/539-combined-reference.html
          git add docs/539-adjacent-backtest.html docs/539-adjacent-backtest.json
          git add docs/539-adjacent-counts-backtest.html docs/539-adjacent-counts-backtest.json
          git add reports/539-adjacent-source.json
          git add docs/lotto649 docs/data/lotto649.json
          git add docs/data/649-*.json reports/649-adjacent-source.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): update Daily 539 statistics"
          git push
      - name: 發布更新後的看板
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
